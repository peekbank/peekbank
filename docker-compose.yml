services:
  peekbank-db:
    image: mariadb:10.6
    container_name: peekbank-db
    environment:
    - MARIADB_DATABASE=${PEEKBANK_DB_NAME}
    - MARIADB_ROOT_PASSWORD=${PEEKBANK_DB_ROOTPW}
    command: --lower_case_table_names=1 --port=${PEEKBANK_DB_PORT}
    ports:
      - 0.0.0.0:${PEEKBANK_DB_PORT}:${PEEKBANK_DB_PORT}
    volumes:
      - ./db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PEEKBANK_DB_ROOTPW}"]
      timeout: 20s
      retries: 10
  
  peekbank-django:
    container_name: peekbank-django
    build: .
    env_file:
      - .env
    volumes:
      - ./${PEEKBANK_DATA_PATH}:/srv/peekbank/${PEEKBANK_DATA_PATH}
  peekbank-backup:
    container_name: peekbank-backup
    build: .
    env_file:
      - .env
    volumes:
      - ./${PEEKBANK_DATA_PATH}:/srv/peekbank/${PEEKBANK_DATA_PATH}
    command: sleep infinity
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup.schedule: "${BACKUP_SCHEDULE:-@monthly}"
      ofelia.job-exec.backup.command: "python manage.py backup"
      ofelia.job-exec.backup.no-overlap: "true"
    profiles:
      - backup

  peekbank-backup-scheduler:
    image: mcuadros/ofelia:latest
    container_name: peekbank-backup-scheduler
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    profiles:
      - backup